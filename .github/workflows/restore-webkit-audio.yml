name: Restore WebKit audio - finalize (VTuLog-LIVE-iOS)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current repository code
        uses: actions/checkout@v4

      - name: Finish WebKit audio restoration without reapplying patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_AUDIO_REPAIR'
          from pathlib import Path

          RECORDING = False

          app_path = Path('src/App.tsx')
          if not app_path.is_file():
              raise SystemExit('src/App.tsx not found. Wrong repository?')
          app = app_path.read_text(encoding='utf-8')

          # A workflow must not declare success if the actual WebKit rollback wasn't applied.
          old_calls = ('prepareIPhoneRecording', 'prepareIPhonePlayback', "from './nativeAudio'", 'NativeAudio.configure(')
          left = [p for p in old_calls if p in app]
          if left:
              raise SystemExit('STOP: App.tsx still uses native audio: ' + ', '.join(left) + '. Apply the provided complete source first; no files changed.')
          if 'navigator.mediaDevices.getUserMedia' not in app:
              raise SystemExit('STOP: WebKit getUserMedia() not found; no files changed.')
          if RECORDING:
              checks = ("'finalizing'", "setAppState('finalizing')", 'mr.onstop', 'previewUrlRef.current')
              missing = [p for p in checks if p not in app]
              if missing:
                  raise SystemExit('STOP: recording preview finalization is not installed: ' + ', '.join(missing) + '. No files changed.')

          # Remove only lines used to install/register the obsolete NativeAudioPlugin.
          # Re-running this script is safe: already removed lines are simply skipped.
          bridge = Path('MultiCamPlugin.swift')
          if not bridge.is_file():
              raise SystemExit('Missing MultiCamPlugin.swift; not touching this repository.')
          raw = bridge.read_text(encoding='utf-8')
          updated = raw.replace('        bridge?.registerPluginInstance(NativeAudioPlugin())\n', '')
          if updated != raw:
              bridge.write_text(updated, encoding='utf-8')
              print('Cleaned MultiCam plugin registration.')

          for filename in ('.github/workflows/build-ios.yml', '.github/workflows/testflight.yml'):
              file = Path(filename)
              if not file.is_file():
                  raise SystemExit(f'Missing {filename}; no legacy plugin deletion will occur.')
              body = file.read_text(encoding='utf-8')
              new = body.replace('          printf "\\n" >> "$APP_DIR/AppDelegate.swift"\n          cat NativeAudioPlugin.swift >> "$APP_DIR/AppDelegate.swift"\n', '')
              new = new.replace("          if 'NativeAudioPlugin' not in plugins:\n              plugins.append('NativeAudioPlugin')\n", '')
              # In case there are minor indentation changes, reject rather than quietly leave a reference.
              if 'NativeAudioPlugin' in new or 'NativeAudioPlugin.swift' in new:
                  raise SystemExit(f'STOP: {filename} still references NativeAudioPlugin. Inspect the workflow before deleting the plugin.')
              if new != body:
                  file.write_text(new, encoding='utf-8')
                  print(f'Cleaned {filename}.')

          # Read the bridge again to verify it no longer requires NativeAudioPlugin.
          if 'NativeAudioPlugin' in bridge.read_text(encoding='utf-8'):
              raise SystemExit('STOP: Swift bridge still references NativeAudioPlugin; keeping plugin sources for safety.')
          for filename in ('NativeAudioPlugin.swift', 'src/nativeAudio.ts', 'NATIVE_AUDIO_UPDATE.md'):
              p = Path(filename)
              if p.is_file():
                  p.unlink()
                  print('Removed unused file:', filename)

          info = Path('WEBKIT_AUDIO_RESTORE.md')
          if not info.exists():
              info.write_text('# WebKit audio restore\n\nAudio is handled by the WebKit MediaStream. The obsolete native audio plugin is not registered.\n\nVerify recording, preview, saving, and live streaming on a real iPhone.\n', encoding='utf-8')

          print('WebKit audio restoration is already present; remaining native plugin references were safely cleaned.')
          PY_AUDIO_REPAIR
          git diff --check

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify web build
        run: pnpm run build:ios

      - name: Commit cleanup, if needed
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'Already fixed - no changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: finalize safe WebKit audio restoration'
          git push
