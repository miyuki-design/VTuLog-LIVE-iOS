      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify web build
        run: pnpm run build:ios

      - name: Commit verified restoration
        shell: bash
        run: |
          set -euo pipefail
          git add -A src/App.tsx MultiCamPlugin.swift .github/workflows/build-ios.yml .github/workflows/testflight.yml NativeAudioPlugin.swift src/nativeAudio.ts NATIVE_AUDIO_UPDATE.md WEBKIT_AUDIO_RESTORE.md
          if git diff --cached --quiet; then
            echo 'Already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore WebKit audio routing and protect recording playback'
          git push
