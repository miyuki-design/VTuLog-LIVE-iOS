name: Build VTuLog LIVE iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Add native OAuth plugins (Capacitor 7)
        run: |
          pnpm add @capacitor/app@7.1.2 @capacitor/browser@7.0.2

      - name: Build iOS web assets
        run: pnpm run build:ios

      - name: Generate iOS project
        run: pnpm exec cap add ios

      - name: Sync Capacitor
        run: pnpm exec cap sync ios

      - name: Install native simultaneous front/rear camera bridge
        run: |
          set -e
          APP_DIR='ios/App/App'
          test -f "$APP_DIR/AppDelegate.swift"
          test -f "$APP_DIR/Base.lproj/Main.storyboard"
          printf "\n" >> "$APP_DIR/AppDelegate.swift"
          cat MultiCamPlugin.swift >> "$APP_DIR/AppDelegate.swift"
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          storyboard = Path('ios/App/App/Base.lproj/Main.storyboard')
          text = storyboard.read_text()
          # The root Capacitor view controller must be our subclass so that
          # capacitorDidLoad() can register the local native plugin.
          text, count = re.subn(
              r'customClass="CAPBridgeViewController"(?: customModule="[^"]*")?(?: customModuleProvider="[^"]*")?',
              'customClass="VTuLogBridgeViewController" customModule="App" customModuleProvider="target"', text)
          if count != 1:
              raise SystemExit(f'Expected one Capacitor view controller, found {count}')
          storyboard.write_text(text)
          PYCODE

      # Register the local Swift plugin through Capacitor's native class list as
      # well as the custom bridge view controller. This avoids relying only on
      # storyboard subclass loading when creating the iOS project in CI.
      - name: Register MultiCam in Capacitor native plugin list
        run: |
          set -e
          python3 - <<'PYCODE'
          import json
          from pathlib import Path

          config_file = Path('ios/App/App/capacitor.config.json')
          if not config_file.is_file():
              raise SystemExit(f'Missing native Capacitor configuration: {config_file}')
          config = json.loads(config_file.read_text(encoding='utf-8'))
          plugins = config.get('packageClassList', [])
          if not isinstance(plugins, list):
              raise SystemExit('Invalid packageClassList in capacitor.config.json')

          # Swift declares @objc(MultiCamPlugin); use its Objective-C runtime name.
          if 'MultiCamPlugin' not in plugins:
              plugins.append('MultiCamPlugin')
          config['packageClassList'] = plugins
          config_file.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Native plugin classes:', ', '.join(plugins))

          storyboard_file = Path('ios/App/App/Base.lproj/Main.storyboard')
          storyboard = storyboard_file.read_text(encoding='utf-8')
          if 'customClass="VTuLogBridgeViewController"' not in storyboard:
              raise SystemExit('Custom bridge view controller was not installed in Main.storyboard')
          print('Custom view controller: VTuLogBridgeViewController')
          PYCODE

      - name: Configure camera, microphone and OAuth callback
        run: |
          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription VTuLog LIVE uses the camera for live streaming." "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string VTuLog LIVE uses the camera for live streaming." "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription VTuLog LIVE uses the microphone for live streaming." "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string VTuLog LIVE uses the microphone for live streaming." "$PLIST"

          # Enables vtuloglive://oauth/callback to reopen the installed iOS app.
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes array' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0 dict' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLName string dev.miminoz.vtuloglive.oauth' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLSchemes array' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string vtuloglive' "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c 'Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 vtuloglive' "$PLIST"

      - name: Add native Google OAuth callback scheme
        run: |
          PLIST="ios/App/App/Info.plist"
          # Custom URL scheme for iOS installed-app OAuth; separate from Twitch.
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:1 dict' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:1:CFBundleURLName string dev.miminoz.vtuloglive.google' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:1:CFBundleURLSchemes array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:1:CFBundleURLSchemes:0 string dev.miminoz.vtuloglive' "$PLIST"

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry VTuLog-LIVE-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VTuLog-LIVE-iOS
          path: VTuLog-LIVE-unsigned.ipa
          retention-days: 7
